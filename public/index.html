<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosine AI — University Helpdesk</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f8fc;
            color: #171923;
            height: 100vh;
            overflow: hidden;
        }

        button {
            font-family: inherit;
        }

        /* =========================
           LAYOUT
        ========================= */

        .app {
            display: flex;
            height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 270px;
            background: #111318;
            color: #fff;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 10px;
            margin-bottom: 28px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
        }

        .brand-name {
            font-size: 18px;
            font-weight: 700;
        }

        .brand-subtitle {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
        }

        .new-chat {
            border: 1px solid #30333b;
            background: #1b1d23;
            color: white;
            padding: 12px 14px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            margin-bottom: 26px;
            transition: 0.2s;
        }

        .new-chat:hover {
            background: #252832;
        }

        .nav-title {
            color: #777d89;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0 10px;
            margin-bottom: 9px;
        }

        .nav-item {
            width: 100%;
            border: none;
            background: transparent;
            color: #c8cbd2;
            padding: 11px 12px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            gap: 11px;
            cursor: pointer;
            text-align: left;
            font-size: 13px;
            margin-bottom: 3px;
            transition: 0.2s;
        }

        .nav-item:hover {
            background: #1d2027;
            color: white;
        }

        .nav-icon {
            width: 20px;
            text-align: center;
            font-size: 15px;
        }

        .sidebar-bottom {
            margin-top: auto;
            border-top: 1px solid #292c33;
            padding-top: 18px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #aeb3bd;
            font-size: 12px;
            padding: 0 10px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #22c55e;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 64px;
            border-bottom: 1px solid #e7e8ed;
            background: rgba(255,255,255,0.9);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
        }

        .top-title {
            font-size: 14px;
            font-weight: 600;
            color: #3f4149;
        }

        .grounded-badge {
            font-size: 11px;
            color: #166534;
            background: #ecfdf3;
            border: 1px solid #bbf7d0;
            padding: 6px 10px;
            border-radius: 20px;
            font-weight: 600;
        }

        /* =========================
           CHAT
        ========================= */

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 45px 20px 130px;
        }

        .chat-container {
            max-width: 880px;
            margin: auto;
        }

        .welcome {
            text-align: center;
            padding-top: 55px;
        }

        .welcome-logo {
            width: 64px;
            height: 64px;
            margin: auto;
            border-radius: 19px;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            box-shadow: 0 15px 35px rgba(79,70,229,0.18);
        }

        .welcome h1 {
            margin-top: 22px;
            font-size: 32px;
            letter-spacing: -0.03em;
        }

        .welcome p {
            color: #6b7280;
            max-width: 600px;
            margin: 10px auto 30px;
            line-height: 1.6;
            font-size: 14px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 680px;
            margin: auto;
        }

        .suggestion {
            border: 1px solid #e3e5eb;
            background: white;
            padding: 16px;
            border-radius: 13px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .suggestion:hover {
            border-color: #b8b5ff;
            transform: translateY(-1px);
            box-shadow: 0 7px 20px rgba(0,0,0,0.05);
        }

        .suggestion-title {
            font-weight: 650;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .suggestion-text {
            color: #777b86;
            font-size: 12px;
        }

        .message {
            display: flex;
            gap: 12px;
            margin-bottom: 26px;
        }

        .message.user {
            justify-content: flex-end;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 12px;
            font-weight: 700;
        }

        .assistant-avatar {
            background: #ede9fe;
            color: #6d28d9;
        }

        .user-avatar {
            background: #e5e7eb;
            color: #374151;
            order: 2;
        }

        .bubble {
            max-width: 720px;
            padding: 14px 17px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.7;
        }

        .assistant .bubble {
            background: white;
            border: 1px solid #e5e7eb;
        }

        .user .bubble {
            background: #4f46e5;
            color: white;
        }

        .sources {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .source-card {
            background: #f5f5f7;
            border: 1px solid #e3e3e8;
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 10px;
            color: #666975;
        }

        /* =========================
           INPUT
        ========================= */

        .input-area {
            position: fixed;
            bottom: 0;
            left: 270px;
            right: 0;
            padding: 20px 25px 25px;
            background: linear-gradient(
                to top,
                #f7f8fc 75%,
                rgba(247,248,252,0)
            );
        }

        .input-box {
            max-width: 880px;
            margin: auto;
            background: white;
            border: 1px solid #dfe1e7;
            border-radius: 15px;
            display: flex;
            align-items: flex-end;
            padding: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.05);
        }

        textarea {
            flex: 1;
            border: none;
            outline: none;
            resize: none;
            min-height: 42px;
            max-height: 130px;
            padding: 10px 12px;
            font-size: 14px;
            font-family: inherit;
        }

        .send-btn {
            width: 42px;
            height: 42px;
            border: none;
            border-radius: 11px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        .send-btn:hover {
            background: #4338ca;
        }

        /* =========================
           LOADING
        ========================= */

        .typing {
            display: flex;
            gap: 5px;
            padding: 8px 0;
        }

        .typing span {
            width: 6px;
            height: 6px;
            background: #8b8e98;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.15s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.3s;
        }

        @keyframes bounce {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-5px);
            }
        }

        /* =========================
           EXPLORE MODAL
        ========================= */

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 17, 23, 0.62);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 30px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            width: min(950px, 100%);
            max-height: 88vh;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 25px 80px rgba(0,0,0,0.25);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            padding: 22px 26px;
            border-bottom: 1px solid #e8e9ee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-header-left h2 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .modal-header-left p {
            color: #777b86;
            font-size: 12px;
        }

        .close-btn {
            width: 36px;
            height: 36px;
            border: none;
            background: #f1f2f5;
            border-radius: 9px;
            cursor: pointer;
            font-size: 18px;
            color: #555862;
        }

        .close-btn:hover {
            background: #e5e7eb;
        }

        .modal-body {
            padding: 28px;
            overflow-y: auto;
            line-height: 1.65;
        }

        .section {
            margin-bottom: 34px;
        }

        .section:last-child {
            margin-bottom: 0;
        }

        .section h3 {
            font-size: 17px;
            margin-bottom: 12px;
            color: #20222a;
        }

        .section h4 {
            font-size: 14px;
            margin: 22px 0 10px;
            color: #373942;
        }

        .section p {
            font-size: 13px;
            color: #5f636e;
            margin-bottom: 12px;
        }

        .section ul,
        .section ol {
            padding-left: 22px;
            color: #5f636e;
            font-size: 13px;
        }

        .section li {
            margin-bottom: 8px;
        }

        .info-note {
            background: #f5f3ff;
            border-left: 4px solid #7c3aed;
            padding: 13px 15px;
            border-radius: 7px;
            font-size: 12px;
            color: #4b4560;
            margin: 14px 0;
        }

        /* =========================
           FEE TABLES
        ========================= */

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin: 13px 0 18px;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
            font-size: 12px;
        }

        th {
            background: #f6f7f9;
            color: #444750;
            font-weight: 700;
            text-align: left;
            padding: 11px 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid #eef0f3;
            color: #5f636e;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .total-row td {
            font-weight: 700;
            color: #24262e;
            background: #fafafa;
        }

        .course-card {
            border: 1px solid #e6e7eb;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .course-card h3 {
            margin-bottom: 12px;
        }

        .course-total {
            font-weight: 700;
            color: #4f46e5;
        }

        .charge-list {
            counter-reset: charge;
            list-style: none !important;
            padding-left: 0 !important;
        }

        .charge-list li {
            display: flex;
            gap: 10px;
        }

        .charge-number {
            width: 22px;
            height: 22px;
            background: #ede9fe;
            color: #6d28d9;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .external-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            color: #4f46e5;
            font-weight: 600;
            text-decoration: none;
        }

        .external-link:hover {
            text-decoration: underline;
        }

        .source-links {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            margin-top: 15px;
        }

        .source-link {
            padding: 8px 12px;
            background: #f5f5f7;
            border: 1px solid #e1e2e7;
            border-radius: 8px;
            text-decoration: none;
            color: #4f46e5;
            font-size: 11px;
            font-weight: 600;
        }

        .source-link:hover {
            background: #ede9fe;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 800px) {
            .sidebar {
                width: 72px;
                padding: 20px 9px;
            }

            .brand-name,
            .brand-subtitle,
            .nav-title,
            .nav-item span:not(.nav-icon),
            .new-chat {
                display: none;
            }

            .brand {
                justify-content: center;
                padding: 0;
            }

            .nav-item {
                justify-content: center;
                padding: 12px;
            }

            .input-area {
                left: 72px;
            }

            .suggestions {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 27px;
            }

            .modal-overlay {
                padding: 10px;
            }

            .modal-body {
                padding: 20px;
            }
        }

        @media (max-width: 550px) {
            .topbar {
                padding: 0 15px;
            }

            .chat-area {
                padding: 30px 14px 120px;
            }

            .input-area {
                padding: 14px;
                left: 72px;
            }

            .grounded-badge {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="brand">
            <div class="brand-logo">C</div>

            <div>
                <div class="brand-name">Cosine AI</div>
                <div class="brand-subtitle">University Helpdesk</div>
            </div>
        </div>

        <button class="new-chat" onclick="newChat()">
            + &nbsp; New Conversation
        </button>

        <div class="nav-title">Explore</div>

        <button class="nav-item" onclick="openExplore('academic')">
            <span class="nav-icon">▣</span>
            <span>Academic Policies</span>
        </button>

        <button class="nav-item" onclick="openExplore('examinations')">
            <span class="nav-icon">✎</span>
            <span>Examinations</span>
        </button>

        <button class="nav-item" onclick="openExplore('fees')">
            <span class="nav-icon">₹</span>
            <span>Fees & Payments</span>
        </button>

        <button class="nav-item" onclick="openExplore('hostel')">
            <span class="nav-icon">⌂</span>
            <span>Hostel & Campus</span>
        </button>

        <div class="nav-title" style="margin-top: 24px;">About</div>

        <button class="nav-item" onclick="showAbout('how')">
            <span class="nav-icon">?</span>
            <span>How Cosine AI Works</span>
        </button>

        <button class="nav-item" onclick="showAbout('sources')">
            <span class="nav-icon">◈</span>
            <span>Source Documents</span>
        </button>

        <div class="sidebar-bottom">
            <div class="status">
                <span class="status-dot"></span>
                Knowledge Base Online
            </div>
        </div>

    </aside>

    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

        <div class="topbar">
            <div class="top-title">Campus Helpdesk Assistant</div>

            <div class="grounded-badge">
                ✓ Source Grounded
            </div>
        </div>

        <div class="chat-area" id="chatArea">

            <div class="chat-container" id="chatContainer">

                <div class="welcome" id="welcome">

                    <div class="welcome-logo">C</div>

                    <h1>How can I help you?</h1>

                    <p>
                        Ask questions about university fees, examinations,
                        academic policies, hostel rules and campus life.
                        Cosine AI answers using the available source documents.
                    </p>

                    <div class="suggestions">

                        <button class="suggestion"
                                onclick="useSuggestion('What are the examination rules?')">
                            <div class="suggestion-title">
                                Examination Rules
                            </div>

                            <div class="suggestion-text">
                                Ask about ID cards, exam entry and conduct.
                            </div>
                        </button>

                        <button class="suggestion"
                                onclick="useSuggestion('What additional charges are applicable apart from tuition fees?')">
                            <div class="suggestion-title">
                                Fee Structure
                            </div>

                            <div class="suggestion-text">
                                Find tuition and additional university charges.
                            </div>
                        </button>

                        <button class="suggestion"
                                onclick="useSuggestion('What is the minimum attendance requirement?')">
                            <div class="suggestion-title">
                                Attendance Policy
                            </div>

                            <div class="suggestion-text">
                                Learn about attendance requirements.
                            </div>
                        </button>

                        <button class="suggestion"
                                onclick="useSuggestion('What hostel facilities are available?')">
                            <div class="suggestion-title">
                                Hostel & Campus
                            </div>

                            <div class="suggestion-text">
                                Explore hostel facilities and campus information.
                            </div>
                        </button>

                    </div>

                </div>

            </div>

        </div>

        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="questionInput"
                    placeholder="Ask Cosine AI anything about the university..."
                    rows="1"
                    onkeydown="handleKey(event)"
                ></textarea>

                <button class="send-btn" onclick="askQuestion()">
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>


<!-- =========================================================
     EXPLORE MODAL
========================================================= -->

<div class="modal-overlay" id="exploreModal">

    <div class="modal">

        <div class="modal-header">

            <div class="modal-header-left">

                <h2 id="modalTitle"></h2>

                <p id="modalSubtitle"></p>

            </div>

            <button class="close-btn" onclick="closeModal()">
                ×
            </button>

        </div>

        <div class="modal-body" id="modalBody"></div>

    </div>

</div>


<script>

/* =========================================================
   CHAT FUNCTIONS
========================================================= */

const chatContainer = document.getElementById("chatContainer");
const chatArea = document.getElementById("chatArea");
const input = document.getElementById("questionInput");

function escapeHTML(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function formatAnswer(text) {

    let safe = escapeHTML(text);

    safe = safe.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");

    safe = safe.replace(/\n\n/g, "<br><br>");

    safe = safe.replace(/\n/g, "<br>");

    return safe;
}

function scrollToBottom() {
    setTimeout(() => {
        chatArea.scrollTop = chatArea.scrollHeight;
    }, 50);
}

function addUserMessage(question) {

    const message = document.createElement("div");

    message.className = "message user";

    message.innerHTML = `
        <div class="avatar user-avatar">U</div>

        <div class="bubble">
            ${escapeHTML(question)}
        </div>
    `;

    chatContainer.appendChild(message);

    scrollToBottom();
}

function addAssistantMessage(answer, sources = []) {

    const message = document.createElement("div");

    message.className = "message assistant";

    let sourcesHTML = "";

    if (sources && sources.length > 0) {

        sourcesHTML = `
            <div class="sources">

                ${sources.map(source => `
                    <div class="source-card">
                        ${escapeHTML(source.document)}
                        · Page ${source.page}
                    </div>
                `).join("")}

            </div>
        `;
    }

    message.innerHTML = `

        <div class="avatar assistant-avatar">
            C
        </div>

        <div>

            <div class="bubble">
                ${formatAnswer(answer)}
            </div>

            ${sourcesHTML}

        </div>
    `;

    chatContainer.appendChild(message);

    scrollToBottom();
}

function addLoadingMessage() {

    const message = document.createElement("div");

    message.className = "message assistant";
    message.id = "loadingMessage";

    message.innerHTML = `

        <div class="avatar assistant-avatar">
            C
        </div>

        <div class="bubble">

            <div class="typing">
                <span></span>
                <span></span>
                <span></span>
            </div>

        </div>
    `;

    chatContainer.appendChild(message);

    scrollToBottom();
}

function removeLoadingMessage() {

    const loading = document.getElementById("loadingMessage");

    if (loading) {
        loading.remove();
    }
}

async function askQuestion() {

    const question = input.value.trim();

    if (!question) {
        return;
    }

    const welcome = document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }

    addUserMessage(question);

    input.value = "";

    addLoadingMessage();

    try {

        const response = await fetch("/ask", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                question: question
            })

        });

        const data = await response.json();

        removeLoadingMessage();

        addAssistantMessage(
            data.answer || "I could not verify this from the available official documents.",
            data.sources || []
        );

    } catch (error) {

        removeLoadingMessage();

        addAssistantMessage(
            "The AI service is currently unavailable. Please try again."
        );
    }
}

function useSuggestion(question) {

    input.value = question;

    askQuestion();
}

function handleKey(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        askQuestion();
    }
}

function newChat() {

    chatContainer.innerHTML = `

        <div class="welcome" id="welcome">

            <div class="welcome-logo">C</div>

            <h1>How can I help you?</h1>

            <p>
                Ask questions about university fees, examinations,
                academic policies, hostel rules and campus life.
                Cosine AI answers using the available source documents.

/* =========================================================
   OPEN EXPLORE MODAL
========================================================= */

function openExplore(type) {

    const data = exploreData[type];

    if (!data) {
        return;
    }

    document.getElementById("modalTitle").textContent = data.title;

    document.getElementById("modalSubtitle").textContent =
        data.subtitle;

    document.getElementById("modalBody").innerHTML =
        data.content;

    document.getElementById("exploreModal")
        .classList.add("active");

    document.body.style.overflow = "hidden";
}

/* =========================================================
   CLOSE MODAL
========================================================= */

function closeModal() {

    document.getElementById("exploreModal")
        .classList.remove("active");

    document.body.style.overflow = "";
}


/* Close when clicking outside the modal */

document.getElementById("exploreModal")
    .addEventListener("click", function(event) {

        if (event.target === this) {
            closeModal();
        }

    });


/* Close with Escape */

document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeModal();
    }

});
